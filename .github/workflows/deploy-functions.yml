name: Deploy Cloud Functions

# 觸發條件：
#  - workflow_dispatch：Repo → Actions → Run workflow（手動）
#  - push to main 且改到 functions/** 或 firestore.* 才觸發（避免每次純前端 push 都跑）
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - '.github/workflows/deploy-functions.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install functions deps
        working-directory: functions
        run: npm ci

      - name: Build functions
        working-directory: functions
        run: npm run build

      - name: Auth to GCP
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PIRLS }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Firestore rules + indexes
        run: npx -y firebase-tools deploy --only firestore --project pirls-questioncraft --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}

      - name: Deploy Cloud Functions
        run: npx -y firebase-tools deploy --only functions --project pirls-questioncraft --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
