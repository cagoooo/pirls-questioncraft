name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate exports and types
        run: |
          npm run typecheck
          npm test

      - name: Build static site
        env:
          # 注意：basePath = /<repo-name>，請與 GitHub repo 名一致
          # 若以後掛自訂網域（CNAME 檔），把這行改成空字串：NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_BASE_PATH: /pirls-questioncraft
          NEXT_PUBLIC_API_BASE: https://asia-east1-pirls-questioncraft.cloudfunctions.net
          # B.4: Cloudflare Turnstile site key (public，可入 git)
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 0x4AAAAAADIPhhdOK3_0FrkR
          # 2026-11-15：AI 出題需 Google 登入（Firebase Auth 設定由 Secrets 注入）
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
        run: npm run build

      - name: Disable Jekyll on GitHub Pages
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
