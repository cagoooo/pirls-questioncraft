<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="PIRLS 閱讀素養題組生成站">
  <!-- 背景：藍紫漸層（對應網站主題 primary→accent）-->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#A387D9"/>
    </linearGradient>
    <linearGradient id="page" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0F5FF"/>
    </linearGradient>
  </defs>

  <!-- 圓角方形背景 -->
  <rect width="64" height="64" rx="14" ry="14" fill="url(#bg)"/>

  <!-- 攤開的書 -->
  <g transform="translate(32 36)">
    <!-- 書脊陰影 -->
    <path d="M 0 -14 L 0 14" stroke="#1E40AF" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>

    <!-- 左頁 -->
    <path d="M -22 -14 L -2 -12 L -2 14 L -22 12 Z" fill="url(#page)" stroke="#1E40AF" stroke-width="1.2" stroke-linejoin="round"/>
    <!-- 右頁 -->
    <path d="M 22 -14 L 2 -12 L 2 14 L 22 12 Z" fill="url(#page)" stroke="#1E40AF" stroke-width="1.2" stroke-linejoin="round"/>

    <!-- 4 條對應 PIRLS 四層次的彩色橫線 -->
    <line x1="-18" y1="-7" x2="-5" y2="-6"  stroke="#3B82F6" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="-18" y1="-3" x2="-5" y2="-2"  stroke="#10B981" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="-18" y1="1"  x2="-5" y2="2"   stroke="#F59E0B" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="-18" y1="5"  x2="-5" y2="6"   stroke="#A387D9" stroke-width="1.6" stroke-linecap="round"/>

    <line x1="5" y1="-6"  x2="18" y2="-7"  stroke="#3B82F6" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="5" y1="-2"  x2="18" y2="-3"  stroke="#10B981" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="5" y1="2"   x2="18" y2="1"   stroke="#F59E0B" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="5" y1="6"   x2="18" y2="5"   stroke="#A387D9" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <!-- AI sparkle 右上 -->
  <g transform="translate(48 18)" fill="#FBBF24">
    <path d="M 0 -6 L 1.5 -1.5 L 6 0 L 1.5 1.5 L 0 6 L -1.5 1.5 L -6 0 L -1.5 -1.5 Z"/>
  </g>
  <circle cx="54" cy="10" r="1.5" fill="#FBBF24"/>
  <circle cx="42" cy="8"  r="1"   fill="#FBBF24"/>
</svg>
