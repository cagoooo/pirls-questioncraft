name: Deploy Cloud Functions

# 觸發條件：
#  - workflow_dispatch：Repo → Actions → Run workflow（手動）
#  - push to main 且改到 functions/** 或 firestore.* 才觸發（避免每次純前端 push 都跑）
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - '.github/workflows/deploy-functions.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install functions deps
        working-directory: functions
        run: npm ci

      - name: Build functions
        working-directory: functions
        run: npm run build

      - name: Privacy and prompt guard tests
        working-directory: functions
        run: node --test test/privacy.test.cjs test/prompt-explanation.test.cjs

      - name: List functions to deploy (named deploy only)
        id: fns
        working-directory: functions
        run: |
          FNS=$(node -e 'const m=require("./"+(require("./package.json").main||"index.js"));const k=Object.keys(m);if(!k.length)process.exit(1);console.log(k.map(f=>"functions:"+f).join(","));process.exit(0)')
          echo "list=$FNS" >> "$GITHUB_OUTPUT"
          echo "將點名部署：$FNS"

      - name: Auth to GCP
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PIRLS }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Firestore rules + indexes
        run: npx -y firebase-tools deploy --only firestore --project pirls-questioncraft --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}

      # 點名部署：只更新本 repo 匯出的函式，不會把專案裡其他系統的函式比對成「多餘」而刪掉
      - name: Deploy Cloud Functions
        run: npx -y firebase-tools deploy --only "${{ steps.fns.outputs.list }}" --project pirls-questioncraft --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
