name: Deploy Cloud Functions

# 預設只手動觸發（Repo → Actions → 此 workflow → Run workflow）。
# 啟用 push 自動部署前，要先在 GitHub Secrets 設定 FIREBASE_SERVICE_ACCOUNT_PIRLS：
#   詳見 docs/OPTIMIZATION.md §A.1
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install functions deps
        working-directory: functions
        run: npm ci

      - name: Build functions
        working-directory: functions
        run: npm run build

      - name: Auth to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PIRLS }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Firestore rules + indexes
        run: npx -y firebase-tools deploy --only firestore --project pirls-questioncraft --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}

      - name: Deploy Cloud Functions
        run: npx -y firebase-tools deploy --only functions --project pirls-questioncraft --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
